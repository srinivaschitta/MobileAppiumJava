name: Mobile tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pr-verify:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile main and test sources
        run: mvn -B test-compile

  mobile-smoke:
    name: Sauce Labs smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: pr-verify
    environment: sauce
    env:
      MOBILE_ENV: sauce
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Sauce smoke
        if: env.SAUCE_USERNAME != ''
        id: smoke
        run: mvn -B test -Denv=sauce -DsuiteXmlFile=src/test/resources/testng-sauce.xml
        continue-on-error: true
      - name: Skip when Sauce secrets are missing
        if: env.SAUCE_USERNAME == ''
        run: echo "SAUCE_USERNAME is not set. Skipping the cloud job."
      - name: Upload Sauce reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-reports
          path: |
            target/surefire-reports
            target/extent
            target/logs
            target/diagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when Sauce tests failed
        if: env.SAUCE_USERNAME != '' && steps.smoke.outcome != 'success'
        run: exit 1
